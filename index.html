<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Maintenance</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f0f4f8; /* Very light blue background */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        h1 {
            color: #1e3a8a; /* Deep blue */
            font-size: 2.5rem;
            margin-top: 30px;
            margin-bottom: 10px;
            letter-spacing: 1.5px;
        }

        p {
            color: #3b82f6; /* Bright blue */
            font-size: 1.2rem;
            max-width: 80%;
        }

        /* Circle Browsing / Loading Spinner */
        .spinner {
            width: 70px;
            height: 70px;
            border: 8px solid #dbeafe; /* Pale blue track */
            border-top: 8px solid #2563eb; /* Primary blue moving element */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Circle Browsing Animation -->
    <div class="spinner"></div>

    <!-- Maintenance Text -->
    <h1>SERVER IN MAINTENANCE</h1>
    <p>We are currently performing scheduled updates. Please check back shortly.</p>

</body>
</html>
